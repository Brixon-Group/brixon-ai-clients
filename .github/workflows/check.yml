name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Consistency and public-content check
        run: node scripts/check.mjs
      - name: Script tests
        run: node --test 'scripts/*.test.mjs'
      - name: Claude Code manifest validation
        run: |
          npx -y @anthropic-ai/claude-code@2.1.318 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.318 plugin validate plugins/brixon-ai-client-core
